[package]
name = "nagi-syntax"
version.workspace = true
edition.workspace = true
publish.workspace = true

# tree-sitter による構文解析とハイライト（ADR 0008）。OS・GPU に依存しない。
[dependencies]
nagi-core.workspace = true
tree-sitter = "=0.27.1"
tree-sitter-language = "0.1.9"
tree-sitter-typescript = "=0.23.2"
tree-sitter-javascript = "=0.25.0"
tree-sitter-java = "=0.23.5"
tree-sitter-kotlin-ng = "=1.1.0"
tree-sitter-python = "=0.25.0"
tree-sitter-bash = "=0.25.1"
tree-sitter-batch = "=0.11.1"
tree-sitter-powershell = "=0.26.4"
tree-sitter-ini = "=1.4.0"
tree-sitter-json = "=0.24.8"
tree-sitter-yaml = "=0.7.2"
tree-sitter-vim = "=0.4.0"
tree-sitter-rust = "=0.24.2"
tree-sitter-css = "=0.25.0"
tree-sitter-html = "=0.23.2"
tree-sitter-c = "=0.24.2"
tree-sitter-cpp = "=0.23.4"
tree-sitter-go = "=0.25.0"
tree-sitter-c-sharp = "=0.23.5"
tree-sitter-php = "=0.25.1"
tree-sitter-ruby = "=0.23.1"
tree-sitter-lua = "=0.5.0"
tree-sitter-scala = "=0.26.3"
tree-sitter-swift = "=0.7.4"
tree-sitter-dart = "=0.2.0"
tree-sitter-zig = "=1.1.2"
tree-sitter-haskell = "=0.24.1"
tree-sitter-elixir = "=0.3.5"
tree-sitter-r = "=1.3.0"
tree-sitter-sequel = "=0.3.11"
tree-sitter-toml-ng = "=0.7.0"
tree-sitter-xml = "=0.7.0"
tree-sitter-make = "=1.1.1"
tree-sitter-cmake = "=0.7.5"
tree-sitter-dockerfile = "=0.2.0"
tree-sitter-groovy = "=0.1.2"
# 本家 1.0.0 はビルドの台本が gcc の -Wno-unused-parameter を MSVC にも渡して失敗する。MSVC を直したフォーク（文法は同じ）
tree-sitter-scss = { package = "cortexkit-tree-sitter-scss", version = "=1.0.1" }
# Markdown（ハイライトとプレビュー。tree-sitter の文法は 2 つに分かれていて注入が要るので、こちらで元の位置を取る）
pulldown-cmark = { version = "0.13.0", default-features = false }
