[package]
name = "nagi-syntax"
version.workspace = true
edition.workspace = true
publish.workspace = true

# tree-sitter による構文解析とハイライト（ADR 0008）。OS・GPU に依存しない。
[dependencies]
nagi-core.workspace = true
tree-sitter = "=0.27.1"
tree-sitter-language = "0.1.9"
tree-sitter-bash = "=0.25.1"
tree-sitter-batch = "=0.11.1"
tree-sitter-powershell = "=0.26.4"
tree-sitter-ini = "=1.4.0"
tree-sitter-json = "=0.24.8"
tree-sitter-yaml = "=0.7.2"
tree-sitter-xml = "=0.7.0"
# ほかの言語（Rust・Java・TypeScript・C など 31）の文法は exe に入れず、使うときにダウンロードする（grammar.rs・grammars/）
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_System_LibraryLoader"] }
# Markdown（ハイライトとプレビュー。tree-sitter の文法は 2 つに分かれていて注入が要るので、こちらで元の位置を取る）
pulldown-cmark = { version = "0.13.0", default-features = false }
