[package]
name = "nagi-workers"
version.workspace = true
edition.workspace = true
publish.workspace = true

# UI スレッドの外で行う仕事（ファイル一覧、全文検索、ファイル監視）。結果はチャネルで返し、届いたら UI を起こす
[dependencies]
# ターミナル: ConPTY（WezTerm の portable-pty）と、出力の解釈（vt100）
portable-pty = "=0.9.0"
vt100 = "=0.16.2"
nagi-syntax.workspace = true
ignore = "0.4.33"
grep-searcher = "0.1.17"
grep-regex = "0.1.14"
grep-matcher = "0.1.9"
# 9.0 は rc なので見送る（architecture.md §12）
notify = { version = "8.2.0", default-features = false }
# データベース: Oracle は公式の ODPI-C（実行時に Instant Client を読み込む）、SQLite は中に組み込む
oracle = "0.6.3"
rusqlite = { version = "0.40.2", features = ["bundled", "column_decltype"] }
# Salesforce: REST API の JSON（項目の順を保つ）と、トークンの暗号化（DPAPI）・PKCE の乱数と SHA-256（Windows の API）
serde_json = { version = "1.0.154", features = ["preserve_order"] }
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Security_Cryptography"] }

[dev-dependencies]
nagi-core.workspace = true
