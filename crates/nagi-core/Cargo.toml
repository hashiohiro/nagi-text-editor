[package]
name = "nagi-core"
version.workspace = true
edition.workspace = true
publish.workspace = true

# GPU・OS に依存しない純粋なロジック（バッファ、カーソル、移動）
[dependencies]
ropey.workspace = true
regex = "1.13.1"
# regex が内部で使っているものと同じ版（バイナリは増えない）。通常の検索を正規表現なしで速く探す
aho-corasick = "1.1.5"
# 同じく内部で使われている版。括弧の対応を byte を飛ばして探す
memchr = "2.8.3"
unicode-width.workspace = true
unicode-segmentation.workspace = true
