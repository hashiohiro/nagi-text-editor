[package]
name = "nagi"
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "nagi"
path = "src/main.rs"

[dependencies]
# ターミナルの画面の色（nagi-workers の vt100 と同じ版）
vt100 = "=0.16.2"
nagi-core.workspace = true
nagi-text.workspace = true
nagi-render.workspace = true
nagi-vim.workspace = true
nagi-syntax.workspace = true
nagi-workers.workspace = true
winit.workspace = true
unicode-segmentation.workspace = true
# nagi-core と同じ版（:s :g の大文字小文字の指定のため直接使う）
regex = "1.13.1"
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Performance",
    "Win32_System_ProcessStatus",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_Storage_EnhancedStorage",
    "Win32_UI_Shell_PropertiesSystem",
] }
